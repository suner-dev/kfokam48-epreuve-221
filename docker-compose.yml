services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      POSTGRES_USER: ${POSTGRES_USER:-kfokam48}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kfokam48} -d ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - kfokam48-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      DB_USERNAME: ${POSTGRES_USER:-kfokam48}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  kfokam48-postgres:
