# Demarrage a zero configuration : `docker compose up --build` suffit.
# Chaque valeur peut neanmoins etre remplacee par un fichier `.env` (ignore par Git) ;
# voir `.env.example`. Ce sont des valeurs de demonstration d'examen, pas des secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-kfokam48}
      POSTGRES_USER: ${POSTGRES_USER:-kfokam48}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kfokam48}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kfokam48} -d ${POSTGRES_DATABASE:-kfokam48}"]
      interval: 5s
      timeout: 5s
      # Une initialisation a froid de la base depasse facilement une minute sur un premier
      # essai ; 30 tentatives evitent que « up --build » echoue sur une base vierge.
      retries: 30
      start_period: 10s
    volumes:
      - kfokam48-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      # Profil PostgreSQL exige par les consignes 2.2 et 6.1 (application-docker.yml).
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DATABASE:-kfokam48}
      DB_USERNAME: ${POSTGRES_USER:-kfokam48}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kfokam48}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  kfokam48-postgres:
