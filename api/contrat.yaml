openapi: 3.0.3
info:
  title: Contrat — Épreuve finale KFOKAM48 (complété par le candidat)
  version: "1.0"
  description: |
    Les cinq opérations de la section « IMPOSÉ » doivent exister EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    La section « LIBRE » (ajoutée par le candidat, sous /api) complète l'API pour
    couvrir les besoins non adressés par les 5 opérations imposées : fin et clôture
    de session, ajout manuel de présence, démarrage et correction d'une relecture,
    remplacement du lien, consultation des résultats et détails de tableau.
    Figé AVANT le premier commit de code (exigence « contrat complété et figé »).
    Auteur : Ngansop Sumo Rainer · 221.
servers:
  - url: http://localhost:8080
security: []

paths:

  # ============================= IMPOSÉ (intouchable) =============================

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      tags: [Presences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE / SESSION_TERMINEE / SESSION_CLOTUREE

  /api/exercices:
    post:
      summary: L'étudiant dépose le lien de son exercice
      tags: [Exercices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE
        "410": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      tags: [Relectures]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE / RELECTURE_NON_ASSIGNEE
        "410": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE
    put:
      summary: "Q10 / RG9 — Correction d'une relecture tant que la session n'est pas clôturée (honore Q10 sans toucher au POST imposé)"
      tags: [Relectures]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture corrigée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_NON_RENDUE
        "410": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      tags: [Tableau]
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences:
                      type: integer
                      description: Nombre total de présences sur les sessions de la promotion
                    exercicesDeposes: { type: integer }
                    moyenne:
                      type: number
                      nullable: true
                      description: Moyenne des notes reçues, calculée par l'API
                    relecturesEnAttente:
                      type: integer
                      description: Nombre de relectures assignées à cet étudiant et non rendues
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ============================= LIBRE (ajouts du candidat) =============================

  /api/promotions:
    get:
      summary: Liste des promotions (données de référence, pour les écrans de sélection)
      tags: [References]
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }

  /api/etudiants:
    get:
      summary: Liste des étudiants d'une promotion (Q1 — choix du nom dans une liste, sans mot de passe)
      tags: [References]
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Étudiants de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom, prenom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
                    prenom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions/{id}:
    get:
      summary: Détail d'une session (formateur)
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                required: [id, titre, code, ouvertureAt, expirationAt, finAt, clotureAt]
                properties:
                  id: { type: integer, format: int64 }
                  titre: { type: string }
                  code: { type: string }
                  promotionId: { type: integer, format: int64 }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
                  finAt:
                    type: string
                    format: date-time
                    nullable: true
                  clotureAt:
                    type: string
                    format: date-time
                    nullable: true
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/sessions/{id}/fin:
    post:
      summary: "Le formateur termine la session ; l'auto-marquage cesse sans clore les dépôts (RG2/RG11)"
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Session terminée
          content:
            application/json:
              schema:
                type: object
                required: [id, finAt]
                properties:
                  id: { type: integer, format: int64 }
                  finAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_TERMINEE
        "410": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/sessions/{id}/cloture:
    post:
      summary: "Trou H1 — Le formateur clôt une session ; si elle est encore ouverte, elle est aussi terminée (RG15)"
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                required: [id, finAt, clotureAt]
                properties:
                  id: { type: integer, format: int64 }
                  finAt: { type: string, format: date-time }
                  clotureAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/sessions/{id}/presences:
    get:
      summary: "Détail par étudiant de la présence à une session, avec sa source (Q14/Q16)"
      tags: [Presences]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Présences de la session
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [etudiantId, nom, present, source, marqueeAt]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    present: { type: boolean }
                    source:
                      type: string
                      nullable: true
                      enum: [ETUDIANT, FORMATEUR]
                    marqueeAt:
                      type: string
                      format: date-time
                      nullable: true
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/sessions/{id}/exercices:
    get:
      summary: "Exercices d'une session et état de leur relecture, pour rendre Q11 visible au formateur"
      tags: [Exercices]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Exercices et relectures de la session
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, etudiantId, statut, relecteurId, commenceeAt, rendueAt]
                  properties:
                    id: { type: integer, format: int64 }
                    etudiantId: { type: integer, format: int64 }
                    statut:
                      type: string
                      enum: [DEPOSE, EN_ATTENTE_DE_RELECTURE, EN_ATTENTE_SANS_RELECTEUR, RELU, EN_ATTENTE_VERROUILLE, RELU_VERROUILLE]
                    relecteurId:
                      type: integer
                      format: int64
                      nullable: true
                    commenceeAt:
                      type: string
                      format: date-time
                      nullable: true
                    rendueAt:
                      type: string
                      format: date-time
                      nullable: true
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/presences/manuelle:
    post:
      summary: "Q14 / RG13 — Le formateur ajoute une présence à la main (source=FORMATEUR), sans code, tant que la session n'est pas clôturée"
      tags: [Presences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée par le formateur
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/relectures/{id}/debut:
    post:
      summary: "Le relecteur commence sa relecture ; le lien de l'exercice devient non remplaçable (Q13)"
      tags: [Relectures]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Relecture commencée
          content:
            application/json:
              schema:
                type: object
                required: [id, commenceeAt]
                properties:
                  id: { type: integer, format: int64 }
                  commenceeAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_COMMENCEE / RELECTURE_NON_ASSIGNEE
        "410": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/exercices/{id}:
    put:
      summary: "Q13 / RG12 — L'étudiant remplace le lien de son exercice tant que la relecture n'a pas commencé"
      tags: [Exercices]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien mis à jour
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut:
                    type: string
                    description: État de l'exercice ; EN_ATTENTE_DE_RELECTURE après le dépôt
                    enum: [DEPOSE, EN_ATTENTE_DE_RELECTURE, EN_ATTENTE_SANS_RELECTEUR, RELU, EN_ATTENTE_VERROUILLE, RELU_VERROUILLE]
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_COMMENCEE
        "410": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/etudiants/{etudiantId}/relectures-recues:
    get:
      summary: "Résultats reçus par l'auteur, sans identité du relecteur (Q8)"
      tags: [Relectures]
      parameters:
        - name: etudiantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Notes et commentaires reçus
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [exerciceId, sessionId, lienExercice, note, commentaire]
                  properties:
                    exerciceId: { type: integer, format: int64 }
                    sessionId: { type: integer, format: int64 }
                    lienExercice: { type: string, format: uri }
                    note: { type: integer, minimum: 0, maximum: 20 }
                    commentaire: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

  /api/relectures/a-faire:
    get:
      summary: "Écran relecteur (F2) — liste des relectures assignées à un étudiant, non encore rendues"
      tags: [Relectures]
      parameters:
        - name: etudiantId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures dues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [relectureId, exerciceId, lienExercice, commenceeAt]
                  properties:
                    relectureId: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    lienExercice: { type: string, format: uri }
                    commenceeAt:
                      type: string
                      format: date-time
                      nullable: true
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
