# Consignes 2.2 et 6.1 — separation de la configuration en trois fichiers :
#   application.yml          : valeurs par defaut sans secret (ce fichier)
#   application-docker.yml   : PostgreSQL du reseau `docker-compose` (profil `docker`)
#   application-test.yml     : H2 en memoire, seul profil utilise par les tests
# Aucun profil ne declare H2 en production et aucun test n'ouvre PostgreSQL.

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never

spring:
  application:
    name: kfokam48-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kfokam48}
    username: ${DB_USERNAME:kfokam48}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
