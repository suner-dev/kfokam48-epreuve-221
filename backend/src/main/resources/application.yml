server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never

spring:
  application:
    name: kfokam48-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kfokam48}
    username: ${DB_USERNAME:kfokam48}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

management:
  endpoints:
    web:
      exposure:
        include: health
