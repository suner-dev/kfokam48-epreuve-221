# Profil « docker » — PostgreSQL du reseau docker-compose (consignes 2.2 et 6.1).
# Activé par SPRING_PROFILES_ACTIVE=docker dans docker-compose.yml.
# Ce fichier ne fait que **compléter** application.yml : le reste (JPA, Flyway, Jackson,
# format d'erreur) y reste défini une seule fois.
#
# Les valeurs par défaut sont des valeurs de démonstration d'examen, délibérément publiées,
# et en aucun cas des secrets réels (consigne 2.2). Chacune est remplaçable par
# l'environnement, et `.env` est ignoré par Git.
spring:
  datasource:
    # « postgres » est le nom du service PostgreSQL dans docker-compose.yml.
    url: ${DB_URL:jdbc:postgresql://postgres:5432/kfokam48}
    username: ${DB_USERNAME:kfokam48}
    password: ${DB_PASSWORD:kfokam48}
